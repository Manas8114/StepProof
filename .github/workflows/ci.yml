name: CI

on:
  push:
    branches: [ main, enterprise-hardening-v9.5 ]
  pull_request:
    branches: [ main, enterprise-hardening-v9.5 ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run hermetic test suite
        run: |
          python -m pytest -q

      - name: Run offline eval smoke test
        run: |
          STEPPROOF_PROVIDER=mock STEPPROOF_DATA=data python -m eval.run_eval --help

