<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Expense Claim</title>
<style>
body{font:15px/1.5 system-ui;margin:40px;max-width:640px}
label{display:block;margin:12px 0 4px;font-weight:600}
input,select{width:100%;padding:8px;font:inherit;box-sizing:border-box}
button{padding:10px 18px;font:inherit;margin-top:16px;cursor:pointer}
#status{margin-top:20px;padding:12px;border-radius:6px;background:#e8f0e8;display:none}
#status.show{display:block}
code{background:#eee;padding:2px 5px;border-radius:4px}
</style>
</head>
<body>
<h1>Expense Claim</h1>
<p id="hint">File a claim. The reference is deterministic: last 4 digits of a hash of (vendor, amount, category).</p>
<form id="f">
  <label for="vendor">Vendor</label>
  <input id="vendor" name="vendor" autocomplete="off" required>
  <label for="amount">Amount (USD)</label>
  <input id="amount" name="amount" type="number" step="0.01" min="0" required>
  <label for="category">Category</label>
  <select id="category" name="category" required>
    <option value="">Choose a category</option>
    <option value="travel">Travel</option>
    <option value="office">Office</option>
    <option value="software">Software</option>
    <option value="meals">Meals</option>
  </select>
  <button id="submit" type="submit">Submit claim</button>
</form>
<div id="status" aria-live="polite"></div>
<script>
document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  const v = document.getElementById('vendor').value.trim();
  const a = document.getElementById('amount').value;
  const c = document.getElementById('category').value;
  if (!v || !a || !c) return;
  let h = 0; const s = v.toLowerCase() + '|' + a + '|' + c;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const ref = 'EXP-' + String(h % 10000).padStart(4, '0');
  const st = document.getElementById('status');
  st.classList.add('show');
  st.innerHTML = '<strong>Claim filed.</strong> Reference <code id="ref">' + ref + '</code> for ' +
    '<strong>' + v + '</strong> (' + c + ', $' + a + ').';
  document.getElementById('submit').disabled = true;
};
</script>
</body>
</html>
